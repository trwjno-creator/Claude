<title>Grafo do Pipeline de Vídeos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* layout: cabecalho compacto + painel lateral (empilha no celular) + canvas do grafo ocupando o resto */
:root{--bg:#f6f5f2;--panel:#ffffff;--fg:#1d1f24;--muted:#6a6e78;--line:#dcdad3;--accent:#c2410c;
--c0:#c2410c;--c1:#2563eb;--c2:#0f766e;--c3:#7c3aed;--c4:#b91c1c;--c5:#a16207;
--display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;--body:'Inter',ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--panel:#1d1f25;--fg:#ececef;--muted:#9a9eaa;--line:#2e313a;--accent:#fb923c;
--c0:#fb923c;--c1:#60a5fa;--c2:#2dd4bf;--c3:#a78bfa;--c4:#f87171;--c5:#facc15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--panel:#1d1f25;--fg:#ececef;--muted:#9a9eaa;--line:#2e313a;--accent:#fb923c;
--c0:#fb923c;--c1:#60a5fa;--c2:#2dd4bf;--c3:#a78bfa;--c4:#f87171;--c5:#facc15;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;display:flex;flex-direction:column}
header{padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
h1{font-family:var(--display);font-size:1.35rem;margin:0;text-wrap:balance}
.stats{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
main{flex:1;display:flex;min-height:0}
aside{width:300px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
#net{flex:1;min-width:0;min-height:420px}
h2{font-family:var(--display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.legend button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;font-size:.86rem;padding:4px 2px;cursor:pointer;border-radius:6px}
.legend button[aria-pressed="false"]{opacity:.35}
.legend button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.n{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}
select,input{width:100%;box-sizing:border-box;font:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#info{font-size:.85rem;line-height:1.45}
#info code{font-size:.78rem;background:var(--bg);padding:1px 4px;border-radius:4px;word-break:break-all}
#info ul{margin:4px 0 0;padding-left:16px}
.key{font-size:.78rem;color:var(--muted);line-height:1.6}
.key span{display:inline-block;width:26px;border-top:2px solid var(--fg);vertical-align:middle;margin-right:6px}
.key span.dash{border-top-style:dashed}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:42vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}#net{min-height:60vh}}
</style>
<header><h1>Grafo do Pipeline de Vídeos</h1><div class="stats" id="stats"></div></header>
<main>
<aside>
  <div><label for="proj">Projeto</label><select id="proj"><option value="">Todos</option><option>mentalista</option><option>supernatural</option><option>dexter</option></select></div>
  <div><label for="q">Buscar nó</label><input id="q" type="search" placeholder="ex.: lib.Char, timeline.json"></div>
  <div class="legend"><h2>Comunidades</h2><div id="legend"></div></div>
  <div class="key"><span></span>EXTRACTED (lido no código)<br><span class="dash"></span>INFERRED (deduzido)<br>Tamanho do nó = grau</div>
  <div><h2>Detalhe</h2><div id="info">Clique num nó para ver fontes e ligações.</div></div>
</aside>
<div id="net" role="img" aria-label="Grafo interativo de módulos, funções, dados e ferramentas"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const shapes = {project:'hexagon',module:'dot',script:'box',function:'dot',class:'diamond',data:'square',tool:'triangle',output:'star',config:'square',template:'square',concept:'ellipse'};
const hidden = new Set();
document.getElementById('stats').textContent = `${DATA.nodes.length} nós · ${DATA.edges.length} arestas · ${DATA.comms.length} comunidades`;
function colors(){return DATA.comms.map((c,i)=>css('--c'+(i%6)))}
const nodes = new vis.DataSet(), edges = new vis.DataSet();
function build(){
  const col = colors(), fg = css('--fg'), muted = css('--muted');
  const proj = document.getElementById('proj').value, q = document.getElementById('q').value.trim().toLowerCase();
  const keep = new Set(DATA.nodes.filter(n => !hidden.has(n.c) && (!proj || n.id.includes(proj+'/') || n.id==='proj:'+proj || n.src.some(s=>s.startsWith(proj+'/')))).map(n=>n.id));
  nodes.clear(); edges.clear();
  nodes.add(DATA.nodes.filter(n=>keep.has(n.id)).map(n=>({id:n.id,label:n.label,shape:shapes[n.type]||'dot',
    size:8+Math.sqrt(n.deg)*3.2,color:{background:col[n.c],border:col[n.c],highlight:{background:fg,border:fg}},
    font:{color:fg,size:q && n.full.toLowerCase().includes(q)?18:11,face:'Inter',strokeWidth:3,strokeColor:css('--bg')},
    borderWidth:q && n.full.toLowerCase().includes(q)?4:1})));
  edges.add(DATA.edges.filter(e=>keep.has(e.from)&&keep.has(e.to)).map((e,i)=>({id:i,from:e.from,to:e.to,
    dashes:e.conf==='INFERRED'?[6,5]:(e.conf==='AMBIGUOUS'?[2,4]:false),color:{color:muted,opacity:.35},width:e.conf==='INFERRED'?1.6:.7,arrows:{to:{enabled:true,scaleFactor:.35}}})));
}
const net = new vis.Network(document.getElementById('net'), {nodes,edges}, {
  physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-55,springLength:70},stabilization:{iterations:250}},
  interaction:{hover:true,tooltipDelay:120}});
net.once('stabilizationIterationsDone',()=>net.setOptions({physics:false}));
function legend(){
  const col=colors(), el=document.getElementById('legend'); el.innerHTML='';
  DATA.comms.forEach((c,i)=>{const b=document.createElement('button');b.setAttribute('aria-pressed',hidden.has(i)?'false':'true');
    b.innerHTML=`<span class="dot" style="background:${col[i]}"></span>${c.name}<span class="n">${c.size}</span>`;
    b.onclick=()=>{hidden.has(i)?hidden.delete(i):hidden.add(i);legend();build();};el.appendChild(b);});
}
net.on('click',p=>{
  const info=document.getElementById('info'); if(!p.nodes.length){return;}
  const n=DATA.nodes.find(x=>x.id===p.nodes[0]); const rel=DATA.edges.filter(e=>e.from===n.id||e.to===n.id).slice(0,14);
  const lab=id=>(DATA.nodes.find(x=>x.id===id)||{full:id}).full;
  info.innerHTML=`<b>${n.full}</b><br><span class="key">${n.type} · grau ${n.deg} · ${DATA.comms[n.c].name}${n.shots?` · ${n.shots} cenas`:''}</span>
   <h2 style="margin-top:10px">Fontes</h2><ul>${n.src.map(s=>`<li><code>${s}</code></li>`).join('')||'<li>—</li>'}</ul>
   <h2 style="margin-top:10px">Ligações</h2><ul>${rel.map(e=>`<li>${e.from===n.id?'→':'←'} ${e.rel} <code>${lab(e.from===n.id?e.to:e.from)}</code>${e.conf!=='EXTRACTED'?' ('+e.conf+')':''}</li>`).join('')}</ul>`;
});
document.getElementById('proj').onchange=build; document.getElementById('q').oninput=build;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{legend();build();});
legend(); build();
