<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Baloo;src:url(fonts/baloo.woff2) format('woff2');font-weight:400 800;}
@font-face{font-family:Nunito;src:url(fonts/nunito.woff2) format('woff2');font-weight:200 1000;}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let D = null; // timeline
const INK = '#2a1f33';
const GLOW = [255, 150, 50];
const COLD = [120, 200, 255];

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeBack = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function rand(seed) { let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function fillStroke(fill, lw = 6, stroke = INK) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }

function line(id) { return D.lines.find(l => l.id === id); }
function wordTime(id, idx, which = 's') { const l = line(id); return l.words[Math.min(idx, l.words.length - 1)][which]; }
function findWord(id, txt, which = 's') { const l = line(id); const w = l.words.find(w => w.w.toLowerCase().replace(/[^a-zà-ú]/g, '').startsWith(txt)); return w ? w[which] : l.start; }
function talking(who, t) {
  for (const l of D.lines) {
    if (l.who !== who || t < l.start - .05 || t > l.end + .05) continue;
    for (const v of l.visemes) if (t >= v.s && t < v.e) return v.v;
    return 'X';
  }
  return null;
}

// ---------- character ----------
// o: {x,y,s,flip,skin,hair,hairColor,shirt,pants,glow,glowCol,pose,look,emo,mouth,blink,scarf,glasses,blush,kid,hat,tear,hoodie,phase}
function drawGlow(x, y, r, a, col = GLOW, t = 0) {
  if (a <= 0.01) return;
  const p = 1 + Math.sin(t * 6) * 0.06;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * p);
  g.addColorStop(0, rgba([255, 240, 200], 0.95 * a));
  g.addColorStop(0.25, rgba(col, 0.75 * a));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * p, 0, Math.PI * 2); ctx.fill();
}
function heatLines(x, y, a, t, col = GLOW) {
  if (a <= 0.05) return;
  ctx.save(); ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    const ph = (t * 1.3 + i * 0.37) % 1;
    ctx.strokeStyle = rgba(col, a * (1 - ph) * 0.9);
    ctx.beginPath();
    for (let k = 0; k <= 10; k++) {
      const yy = y - ph * 120 - k * 7, xx = x + i * 70 + Math.sin(k * 0.9 + t * 8 + i) * 8;
      k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function arm(sx, sy, hx, hy, bend, col, skin, lw = 30) {
  const L = 82; const dx = hx - sx, dy = hy - sy; let d = Math.hypot(dx, dy);
  let ex, ey;
  if (d >= 2 * L - 1) { ex = (sx + hx) / 2; ey = (sy + hy) / 2; }
  else { const h = Math.sqrt(L * L - (d / 2) ** 2); ex = (sx + hx) / 2 + (-dy / d) * h * bend; ey = (sy + hy) / 2 + (dx / d) * h * bend; }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = lw + 12;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  circ(hx, hy, 19); fillStroke(skin, 6);
}
const POSES = {
  down: [[-88, -112, 1], [88, -112, -1]],
  neck: [[-88, -112, 1], [92, -300, -1]],
  neck2: [[-40, -282, -1], [38, -282, 1]],
  pat: [[-88, -112, 1], [215, -238, 1]],
  wrap: [[-55, -262, -1], [55, -262, 1]],
  hold: [[-50, -175, -1], [50, -175, 1]],
  wave: [[-88, -112, 1], [140, -400, 1]],
  chin: [[-88, -112, 1], [20, -318, 1]],
  hips: [[-118, -150, -1], [118, -150, 1]],
};
function mouthShape(v, emo, x, y) {
  ctx.save(); ctx.translate(x, y);
  const dark = '#5a1e2a', tongue = '#e46a77';
  const open = (w, h) => { ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); fillStroke(dark, 5); ctx.save(); ctx.clip(); circ(0, h * 0.9, w * 0.7); ctx.fillStyle = tongue; ctx.fill(); ctx.restore(); };
  switch (v) {
    case 'A': open(20, 19); break;
    case 'E': open(25, 11); break;
    case 'O': open(13, 15); break;
    case 'D': open(17, 8); break;
    case 'F': ctx.beginPath(); ctx.moveTo(-18, 0); ctx.quadraticCurveTo(0, 6, 18, 0); fillStroke(null, 6); rr(-10, -6, 20, 6, 2); fillStroke('#fff', 3); break;
    case 'M': ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); fillStroke(null, 7); break;
    default:
      if (emo === 'happy' || emo === 'smile') { ctx.beginPath(); ctx.moveTo(-22, -4); ctx.quadraticCurveTo(0, 18, 22, -4); fillStroke(null, 7); }
      else if (emo === 'sad' || emo === 'cry') { ctx.beginPath(); ctx.moveTo(-18, 8); ctx.quadraticCurveTo(0, -6, 18, 8); fillStroke(null, 7); }
      else if (emo === 'shock') { ctx.beginPath(); ctx.ellipse(0, 4, 11, 15, 0, 0, Math.PI * 2); fillStroke(dark, 5); }
      else if (emo === 'grin') { ctx.beginPath(); ctx.moveTo(-26, -6); ctx.quadraticCurveTo(0, 26, 26, -6); ctx.closePath(); fillStroke(dark, 6); }
      else { ctx.beginPath(); ctx.moveTo(-14, 2); ctx.quadraticCurveTo(0, 6, 14, 2); fillStroke(null, 7); }
  }
  ctx.restore();
}
function drawHairBack(o, hc) {
  if (o.hair === 'long') { rr(-118, -470, 236, 250, 90); fillStroke(hc, 6); }
  if (o.hair === 'bun') { circ(0, -488, 44); fillStroke(hc, 6); }
}
function drawHairFront(o, hc) {
  const hy = -370;
  ctx.save();
  if (o.hair === 'boy' || o.hair === 'man') {
    ctx.beginPath(); ctx.arc(0, hy, 112, Math.PI * 1.02, Math.PI * 1.98); ctx.lineTo(96, hy - 30);
    for (let i = 0; i <= 6; i++) { const xx = 96 - i * 32; ctx.lineTo(xx - 16, hy - 52 + (i % 2 ? 10 : -6)); ctx.lineTo(xx - 32, hy - 32); }
    ctx.closePath(); fillStroke(hc, 6);
  } else if (o.hair === 'long') {
    ctx.beginPath(); ctx.arc(0, hy, 113, Math.PI * 1.0, Math.PI * 2.0); ctx.quadraticCurveTo(60, hy - 70, -10, hy - 60); ctx.quadraticCurveTo(-80, hy - 50, -113, hy); ctx.closePath(); fillStroke(hc, 6);
  } else if (o.hair === 'curly') {
    for (let i = 0; i < 9; i++) { const a = Math.PI * (1.05 + i * 0.112); circ(Math.cos(a) * 100, hy + Math.sin(a) * 100 - 6, 34); fillStroke(hc, 6); }
    circ(0, hy - 92, 40); fillStroke(hc, 6);
  } else if (o.hair === 'bun') {
    ctx.beginPath(); ctx.arc(0, hy, 112, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(40, hy - 62, 0, hy - 70); ctx.quadraticCurveTo(-40, hy - 62, -108, hy - 28); ctx.closePath(); fillStroke(hc, 6);
  } else if (o.hair === 'baby') {
    ctx.beginPath(); ctx.moveTo(-10, hy - 104); ctx.quadraticCurveTo(10, hy - 140, 26, hy - 112); fillStroke(null, 6);
  }
  ctx.restore();
}
function drawPerson(o, t) {
  const s = o.s || 1;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(o.flip ? -s : s, s);
  const skin = o.skin || '#f2c7a0', hc = o.hairColor || '#3b2a20', shirt = o.shirt || '#4bb3a7', pants = o.pants || '#3d4a6b';
  const bob = o.walk ? Math.abs(Math.sin(t * 7 + (o.phase || 0))) * 10 : Math.sin(t * 2 + (o.phase || 0)) * 2;
  ctx.translate(0, -bob);
  // glow (behind)
  if (o.glow) { drawGlow(0, -278, 190, o.glow, o.glowCol || GLOW, t + (o.phase || 0)); heatLines(0, -420, o.glow * 0.8, t + (o.phase || 0), o.glowCol || GLOW); }
  // legs
  if (!o.noLegs) {
    const sw = o.walk ? Math.sin(t * 7 + (o.phase || 0)) * 14 : 0;
    rr(-58 + sw, -100, 46, 104, 18); fillStroke(pants, 6);
    rr(12 - sw, -100, 46, 104, 18); fillStroke(pants, 6);
    rr(-66 + sw, -12, 60, 22, 11); fillStroke('#2b2b38', 5);
    rr(8 - sw, -12, 60, 22, 11); fillStroke('#2b2b38', 5);
  }
  drawHairBack(o, hc);
  // torso
  rr(-82, -268, 164, 182, 52); fillStroke(shirt, 6);
  if (o.hoodie) { ctx.beginPath(); ctx.moveTo(-20, -250); ctx.lineTo(-24, -190); ctx.moveTo(20, -250); ctx.lineTo(24, -190); fillStroke(null, 5); rr(-46, -170, 92, 46, 18); fillStroke(null, 5); }
  // neck
  rr(-24, -290, 48, 34, 10); fillStroke(skin, 6);
  // scarf
  if (o.scarf) drawScarf(o.scarf, t);
  // arms
  const pose = POSES[o.pose || 'down'];
  const sh = [[-74, -238], [74, -238]];
  const ap = o.armP != null ? o.armP : 1, prev = POSES[o.posePrev || 'down'];
  for (let i = 0; i < 2; i++) {
    let hx = lerp(prev[i][0], pose[i][0], ap), hy = lerp(prev[i][1], pose[i][1], ap);
    if (o.handOff && i === 1) { hx += o.handOff[0]; hy += o.handOff[1]; }
    arm(sh[i][0], sh[i][1], hx, hy, pose[i][2], shirt, skin);
  }
  // head
  const hy = -370;
  circ(-104, hy + 6, 20); fillStroke(skin, 6); circ(104, hy + 6, 20); fillStroke(skin, 6);
  circ(0, hy, 112); fillStroke(skin, 6);
  drawHairFront(o, hc);
  if (o.hat === 'party') { ctx.beginPath(); ctx.moveTo(-50, hy - 92); ctx.lineTo(10, hy - 230); ctx.lineTo(60, hy - 86); ctx.closePath(); fillStroke('#ff5d8f', 6); circ(10, hy - 232, 16); fillStroke('#ffd84d', 5); }
  if (o.hat === 'grad') { ctx.beginPath(); ctx.moveTo(-130, hy - 100); ctx.lineTo(0, hy - 150); ctx.lineTo(130, hy - 100); ctx.lineTo(0, hy - 60); ctx.closePath(); fillStroke('#23232f', 6); rr(-62, hy - 100, 124, 40, 8); fillStroke('#23232f', 6); ctx.beginPath(); ctx.moveTo(0, hy - 105); ctx.quadraticCurveTo(110, hy - 100, 116, hy - 40); ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = 6; ctx.stroke(); }
  // face
  const lx = (o.look || 0) * 10, ly = (o.lookY || 0) * 8;
  const emo = o.emo || 'neutral';
  const blink = o.blink != null ? o.blink : ((t + (o.phase || 0) * 1.7) % 3.4 < 0.12);
  for (const ex of [-40, 40]) {
    ctx.save(); ctx.translate(ex + lx, hy - 8 + ly);
    if (blink || emo === 'closed') { ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(0, 8, 14, 0); fillStroke(null, 7); }
    else if (emo === 'shock') { circ(0, 0, 22); fillStroke('#fff', 5); circ(0, 0, 7); ctx.fillStyle = INK; ctx.fill(); }
    else if (emo === 'happy') { ctx.beginPath(); ctx.moveTo(-14, 4); ctx.quadraticCurveTo(0, -12, 14, 4); fillStroke(null, 7); }
    else { ctx.beginPath(); ctx.ellipse(0, 0, 12, 17, 0, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill(); circ(-4, -6, 5); ctx.fillStyle = '#fff'; ctx.fill(); }
    ctx.restore();
  }
  // brows
  ctx.save(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  const bd = { sad: [-10, 8], cry: [-12, 10], shock: [-14, -14], happy: [-6, -6], neutral: [0, 0], smile: [-2, -2], grin: [-4, -4], closed: [-8, 6] }[emo] || [0, 0];
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 22 + lx, hy - 44 + (sx < 0 ? bd[1] : bd[1]) * 0 + bd[0] * 0.2 + (bd[1] > 0 ? 0 : bd[0] * 0.3)); ctx.lineTo(sx * 58 + lx, hy - 44 + (bd[1] > 0 ? bd[1] : bd[0] * 0.3)); ctx.stroke(); }
  ctx.restore();
  if (o.glasses) { ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = INK; circ(-40 + lx, hy - 8, 30); ctx.stroke(); circ(40 + lx, hy - 8, 30); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-10 + lx, hy - 10); ctx.lineTo(10 + lx, hy - 10); ctx.stroke(); ctx.restore(); }
  if (o.blush) { ctx.fillStyle = `rgba(255,90,110,${0.35 * o.blush})`; circ(-66, hy + 24, 22); ctx.fill(); circ(66, hy + 24, 22); ctx.fill(); }
  if (o.wrinkles) { ctx.save(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(42,31,51,.45)'; ctx.beginPath(); ctx.moveTo(-80, hy + 6); ctx.lineTo(-90, hy + 14); ctx.moveTo(80, hy + 6); ctx.lineTo(90, hy + 14); ctx.stroke(); ctx.restore(); }
  mouthShape(o.mouth || 'X', emo, lx * 0.6, hy + 48);
  if (o.tear) { const ty = hy + 10 + (o.tear % 1) * 70; ctx.save(); ctx.globalAlpha = 1 - (o.tear % 1) * 0.6; ctx.beginPath(); ctx.moveTo(-44 + lx, ty - 16); ctx.quadraticCurveTo(-30 + lx, ty + 6, -44 + lx, ty + 8); ctx.quadraticCurveTo(-58 + lx, ty + 6, -44 + lx, ty - 16); fillStroke('#9fd8ff', 4); ctx.restore(); }
  ctx.restore();
}
function drawScarf(k, t) {
  ctx.save();
  const w = 150 * k;
  ctx.beginPath(); ctx.rect(-80, -320, 160 * clamp(k * 1.2), 120); ctx.clip();
  rr(-75, -300, 150, 44, 20); fillStroke('#d7263d', 6);
  ctx.strokeStyle = '#ffd1d8'; ctx.lineWidth = 5; for (let i = -50; i <= 50; i += 34) { ctx.beginPath(); ctx.moveTo(i, -296); ctx.lineTo(i - 8, -260); ctx.stroke(); }
  ctx.restore();
  if (k > 0.7) {
    const sw = Math.sin(t * 3) * 6 * (k - 0.7);
    ctx.save(); ctx.globalAlpha = clamp((k - 0.7) / 0.3);
    ctx.beginPath(); ctx.moveTo(30, -266); ctx.lineTo(70 + sw, -150); ctx.lineTo(28 + sw, -150); ctx.lineTo(4, -266); ctx.closePath(); fillStroke('#d7263d', 6);
    ctx.strokeStyle = '#ffd1d8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(26 + sw, -175); ctx.lineTo(66 + sw, -175); ctx.stroke();
    ctx.restore();
  }
}

// ---------- backgrounds ----------
function bgStreet(t, warm = 0, camX = 0) {
  ctx.fillStyle = vgrad(0, H, warm ? ['#ff9e6d', '#ffc28a', '#ffd9a8'] : ['#3b2c6b', '#a95c8f', '#ffab76']);
  ctx.fillRect(-400, -400, W + 800, H + 800);
  circ(780, 520, 120); ctx.fillStyle = warm ? 'rgba(255,240,200,.9)' : 'rgba(255,214,150,.85)'; ctx.fill();
  // far buildings
  for (let i = -3; i < 12; i++) {
    const bx = i * 150 - (camX * 0.3) % 150, bh = 420 + rand(i + 3) * 380;
    ctx.fillStyle = warm ? '#d9826a' : '#5b3f73'; ctx.fillRect(bx, 1180 - bh, 140, bh + 50);
  }
  for (let i = -3; i < 10; i++) {
    const bx = i * 220 - (camX * 0.6) % 220, bh = 360 + rand(i + 40) * 360;
    rr(bx, 1250 - bh, 200, bh + 20, 10); fillStroke(warm ? '#b5604f' : '#3f2b57', 6);
    for (let r = 0; r < Math.floor(bh / 90); r++) for (let c = 0; c < 3; c++) {
      const lit = rand(i * 31 + r * 7 + c) > 0.45;
      rr(bx + 24 + c * 58, 1250 - bh + 30 + r * 90, 36, 50, 6); ctx.fillStyle = lit ? '#ffd27a' : (warm ? '#8e4a3e' : '#2c1f40'); ctx.fill();
    }
  }
  ctx.fillStyle = warm ? '#c98e6d' : '#6b5a7a'; ctx.fillRect(-400, 1250, W + 800, 120);
  ctx.fillStyle = warm ? '#a8705a' : '#4a3d5c'; ctx.fillRect(-400, 1370, W + 800, 1000);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 4; for (let i = -6; i < 14; i++) { ctx.beginPath(); ctx.moveTo(i * 120 - camX % 120, 1250); ctx.lineTo(i * 120 - camX % 120 - 40, 1370); ctx.stroke(); }
}
function bgClass(t, rainy = 0) {
  ctx.fillStyle = vgrad(0, H, ['#f5e6c8', '#efd9b0']); ctx.fillRect(-400, -400, W + 800, H + 800);
  ctx.fillStyle = '#d9b98a'; ctx.fillRect(-400, 1180, W + 800, 1200);
  // board
  rr(90, 230, 640, 380, 18); fillStroke('#2f5d50', 10, '#7a5230');
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '700 46px Nunito'; ctx.fillText('2 + 2 = 4', 150, 340); ctx.fillText('x² + y = ?', 150, 420);
  ctx.font = '700 34px Nunito'; ctx.fillText('não olhe pra nuca', 330, 540); ctx.fillText('do colega!', 410, 580);
  // window
  rr(790, 230, 250, 420, 14); fillStroke(rainy ? '#6a7d99' : '#9fd3ff', 10, '#7a5230');
  if (!rainy) { circ(900, 330, 40); ctx.fillStyle = '#fff4c2'; ctx.fill(); }
  else { ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3; for (let i = 0; i < 18; i++) { const x = 800 + rand(i) * 230, y = 240 + ((t * 600 + rand(i + 9) * 400) % 400); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 26); ctx.stroke(); } }
  ctx.beginPath(); ctx.moveTo(915, 230); ctx.lineTo(915, 650); ctx.moveTo(790, 440); ctx.lineTo(1040, 440); fillStroke(null, 8, '#7a5230');
}
function desk(x, y, s = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rr(-150, -20, 300, 40, 10); fillStroke('#c8874f', 6); rr(-130, 20, 20, 150, 6); fillStroke('#8a5a33', 5); rr(110, 20, 20, 150, 6); fillStroke('#8a5a33', 5); ctx.restore(); }
function bgHome(t) {
  ctx.fillStyle = vgrad(0, H, ['#f3c27a', '#e8a35f']); ctx.fillRect(-400, -400, W + 800, H + 800);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; for (let y = 0; y < 1300; y += 90) for (let x = (y / 90 % 2) * 45; x < W; x += 90) { circ(x, y, 10); ctx.fill(); }
  ctx.fillStyle = '#9b5d3b'; ctx.fillRect(-400, 1280, W + 800, 1000);
  ctx.fillStyle = '#b8744c'; ctx.fillRect(-400, 1260, W + 800, 30);
  rr(620, 260, 340, 460, 16); fillStroke('#ffd98a', 12, '#6e3f25');
  circ(790, 560, 90); ctx.fillStyle = '#ff9c4a'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(790, 260); ctx.lineTo(790, 720); ctx.moveTo(620, 490); ctx.lineTo(960, 490); fillStroke(null, 10, '#6e3f25');
  // light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(640 + i * 80, 280); ctx.lineTo(300 + i * 140 + Math.sin(t + i) * 10, 1500); ctx.lineTo(380 + i * 140 + Math.sin(t + i) * 10, 1500); ctx.lineTo(700 + i * 80, 280); ctx.closePath(); ctx.fillStyle = 'rgba(255,220,150,.07)'; ctx.fill(); }
  ctx.restore();
  // frames
  rr(120, 330, 160, 200, 10); fillStroke('#fff1d6', 10, '#6e3f25'); circ(200, 410, 40); fillStroke('#f2c7a0', 4);
  rr(320, 380, 130, 150, 10); fillStroke('#fff1d6', 10, '#6e3f25');
  // lamp
  rr(70, 900, 30, 380, 10); fillStroke('#6e3f25', 5); ctx.beginPath(); ctx.moveTo(10, 900); ctx.lineTo(160, 900); ctx.lineTo(120, 790); ctx.lineTo(50, 790); ctx.closePath(); fillStroke('#ffe7a8', 6);
}
function bgHospital(t) {
  ctx.fillStyle = vgrad(0, H, ['#bfe3df', '#a6d1cc']); ctx.fillRect(-400, -400, W + 800, H + 800);
  ctx.fillStyle = '#e8efe9'; ctx.fillRect(-400, 1260, W + 800, 1000);
  rr(640, 260, 300, 360, 14); fillStroke('#1c2846', 10, '#7f9a97');
  for (let i = 0; i < 20; i++) { circ(660 + rand(i) * 260, 280 + rand(i + 5) * 320, 3); ctx.fillStyle = '#fff'; ctx.fill(); }
  circ(860, 340, 36); ctx.fillStyle = '#f4f1d0'; ctx.fill();
  // monitor

const HARD_CUT = new Set(['COLD', 'CLASS']);

function renderFrame(t) {
