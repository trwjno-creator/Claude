<!doctype html>
<html><head><meta charset="utf-8">
<!-- PADRÃO DE CAPA · GRANDE RESUMO · 1080x1920
     Zona segura = y 430..1500 (quadrado central 1080x1080): aparece no feed, no grid 3:4 e no grid 1:1.
     Os campos {{...}} são preenchidos pelo gerar_capa.py a partir do JSON. -->
<style>
:root{--cor:{{COR}};--cor2:{{COR2}};--escuro:{{ESCURO}};}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;color:#fff;background:var(--escuro)}
.abs{position:absolute}
/* ---------- FUNDO ---------- */
.bg{inset:-60px;background:url({{HEROI}}) center/cover;filter:blur(26px) brightness(.5) saturate(1.3)}
.tint{inset:0;background:
  radial-gradient(ellipse 80% 45% at 50% 50%,color-mix(in srgb,var(--cor) 45%,transparent) 0%,transparent 70%),
  linear-gradient(180deg,color-mix(in srgb,var(--escuro) 92%,transparent) 0%,transparent 22%,transparent 70%,var(--escuro) 92%)}
.raios{inset:0;opacity:.18;background:repeating-conic-gradient(from 0deg at 50% 52%,#fff 0 3deg,transparent 3deg 15deg);
  -webkit-mask:radial-gradient(circle at 50% 52%,#000 0,transparent 62%);mask:radial-gradient(circle at 50% 52%,#000 0,transparent 62%)}
.listras{inset:0;opacity:.07;background:repeating-linear-gradient(-35deg,#fff 0 2px,transparent 2px 26px)}
.dots{width:520px;height:520px;opacity:.35;background:radial-gradient(circle,var(--cor2) 2.4px,transparent 3px) 0 0/22px 22px;
  -webkit-mask:radial-gradient(circle at 0 0,#000 0,transparent 70%);mask:radial-gradient(circle at 0 0,#000 0,transparent 70%)}
.d1{left:0;top:0}.d2{right:0;bottom:0;transform:rotate(180deg)}
.grao{inset:0;opacity:.13;mix-blend-mode:overlay}
/* moldura */
.moldura{inset:26px;border:3px solid rgba(255,255,255,.14);border-radius:46px}
.canto{width:90px;height:90px;border:8px solid var(--cor2)}
.c1{left:26px;top:26px;border-right:0;border-bottom:0;border-radius:46px 0 0 0}
.c2{right:26px;top:26px;border-left:0;border-bottom:0;border-radius:0 46px 0 0}
.c3{left:26px;bottom:26px;border-right:0;border-top:0;border-radius:0 0 0 46px}
.c4{right:26px;bottom:26px;border-left:0;border-top:0;border-radius:0 0 46px 0}
/* ---------- TOPO (fora do grid, aparece no feed) ---------- */
.topo{left:0;right:0;top:432px;display:flex;align-items:center;justify-content:center;gap:18px}
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:60px;height:60px;border-radius:50%;border:3px solid var(--cor2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.marca b{display:block;font-weight:900;font-size:28px;letter-spacing:3px;line-height:1}
.marca span{display:none}
.num{font-weight:900;font-size:22px;letter-spacing:3px;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.25)}
.num em{font-style:normal;color:var(--cor2)}
/* ---------- ZONA PRINCIPAL ---------- */
.kicker{display:none;left:0;right:0;top:300px;text-align:center;font-weight:700;font-size:30px;letter-spacing:12px}
.kicker i{display:inline-block;width:70px;height:4px;background:var(--cor2);vertical-align:middle;margin:0 24px;border-radius:2px}
.titulo{left:0;right:0;top:505px;text-align:center;font-weight:900;font-size:{{TAM_TITULO}}px;letter-spacing:-4px;line-height:1;white-space:nowrap;
  text-shadow:0 3px 0 var(--sombra),0 6px 0 var(--sombra),0 9px 0 var(--sombra),0 30px 40px rgba(0,0,0,.6);--sombra:color-mix(in srgb,var(--cor) 55%,#000)}
.titulo b{color:var(--cor2)}
.chips{left:0;right:0;top:{{TOP_CHIPS}}px;display:flex;justify-content:center;gap:14px}
.chips span{font-weight:800;font-size:20px;letter-spacing:3px;padding:8px 18px;border-radius:40px;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35)}
.chips span:first-child{background:var(--cor);border-color:var(--cor)}
/* card herói */
.heroi{left:110px;right:110px;top:705px;height:400px;border-radius:32px;overflow:hidden;border:6px solid var(--cor2);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--cor2) 25%,transparent),0 0 80px color-mix(in srgb,var(--cor) 70%,transparent),0 30px 60px rgba(0,0,0,.6)}
.heroi img{width:100%;height:100%;object-fit:cover;display:block}
.heroi:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55))}
.tagao{left:18px;top:18px;z-index:2;font-weight:900;font-size:20px;letter-spacing:2px;padding:9px 16px;border-radius:30px;background:var(--cor);display:flex;gap:12px;align-items:center}
.tagao i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35)}
.dur{right:18px;top:18px;z-index:2;font-weight:900;font-size:22px;padding:9px 16px;border-radius:30px;background:rgba(0,0,0,.65);display:flex;gap:12px;align-items:center}
.dur svg{width:18px;height:18px}
/* cenas */
.cenas{left:0;right:0;top:1060px;height:250px}
.cena{position:absolute;width:250px;background:#fff;padding:10px 10px 0;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.55)}
.cena img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.cena p{margin:0;padding:8px 0 10px;text-align:center;color:#141414;font-weight:900;font-size:24px;letter-spacing:-.5px}
.cena .n{position:absolute;left:-12px;top:-12px;width:42px;height:42px;border-radius:50%;background:var(--cor2);color:#141414;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;border:4px solid #fff}
.s1{left:120px;top:18px;transform:rotate(-7deg)}
.s2{left:415px;top:0;transform:rotate(2deg);z-index:2}
.s3{left:710px;top:18px;transform:rotate(7deg)}
/* gancho */
.gancho{left:0;right:0;top:1318px;display:flex;justify-content:center}
.gancho div{display:flex;align-items:center;gap:20px;background:var(--cor);padding:12px 32px 14px 14px;border-radius:24px;transform:rotate(-2deg);
  box-shadow:0 10px 0 color-mix(in srgb,var(--cor) 55%,#000),0 24px 50px color-mix(in srgb,var(--cor) 50%,transparent);border:4px solid rgba(255,255,255,.9)}
.gancho i{width:60px;height:60px;border-radius:50%;background:var(--cor2);color:#141414;font-style:normal;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.gancho b{font-weight:900;font-size:{{TAM_GANCHO}}px;letter-spacing:-1.5px;white-space:nowrap}
/* stats */
.stats{left:170px;right:170px;top:1428px;display:flex;gap:14px}
.stats div{flex:1;text-align:center;padding:8px 0 9px;border-radius:16px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.18)}
.stats b{display:inline;font-weight:900;font-size:30px;color:var(--cor2);line-height:1.05}
.stats span{display:inline;margin-left:8px;font-weight:700;font-size:16px;letter-spacing:2px;opacity:.8;text-transform:uppercase}
/* rodapé (fora do grid) */
.rodape{display:none;left:0;right:0;top:1740px;text-align:center;font-weight:800;font-size:26px;letter-spacing:8px;opacity:.85}
.rodape em{font-style:normal;color:var(--cor2)}
</style></head><body><div id="c">
<div class="abs bg"></div><div class="abs tint"></div><div class="abs raios"></div><div class="abs listras"></div>
<div class="abs dots d1"></div><div class="abs dots d2"></div>
<svg class="abs grao" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="abs moldura"></div><div class="abs canto c1"></div><div class="abs canto c2"></div><div class="abs canto c3"></div><div class="abs canto c4"></div>

<div class="abs topo">
  <div class="marca"><img src="{{LOGO}}"><div><b>GRANDE RESUMO</b><span>SÉRIES EM MINUTOS</span></div></div>
  <div class="num">Nº <em>{{NUMERO}}</em></div>
</div>

<div class="abs kicker"><i></i>{{KICKER}}<i></i></div>
<div class="abs titulo">{{T1}}<b>{{T2}}</b></div>
<div class="abs chips">{{CHIPS}}</div>

<div class="abs heroi"><img src="{{HEROI}}">
  <div class="abs tagao"><i></i>{{TAG_HEROI}}</div>
  <div class="abs dur"><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z" fill="#fff"/></svg>{{DURACAO}}</div>
</div>

<div class="abs cenas">{{CENAS}}</div>

<div class="abs gancho"><div><i>?</i><b>{{GANCHO}}</b></div></div>
<div class="abs stats">{{STATS}}</div>
<div class="abs rodape">{{RODAPE}}</div>
</div></body></html>
